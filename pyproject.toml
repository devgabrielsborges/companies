[project]
name = "companies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devgabrielsborges", email = "dev.gabrielsborges@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=4.5.1",
    "dash-bootstrap-components>=2.0.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
companies = "companies:main"
companies-dashboard = "companies.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "autoflake>=2.4.0",
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "vulture>=2.16",
]
